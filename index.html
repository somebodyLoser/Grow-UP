<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<title>自我记录</title>

<!-- iOS 添加到主屏幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="自我记录">
<link rel="apple-touch-icon" href="./assets/icon-180.png">
<link rel="icon" href="./assets/icon-192.png">
<link rel="manifest" href="./manifest.webmanifest">

<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">

<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/components.css">
<link rel="stylesheet" href="./css/pages.css">
</head>
<body>

<div id="app">

  <!-- 滚动后出现的吸顶标题 -->
  <div class="navbar" id="navbar" aria-hidden="true">
    <div class="navbar-title" id="navbarTitle">今天</div>
  </div>

  <main id="main">
    <section class="page" id="page-today"  data-tab="today"><div class="page-inner"></div></section>
    <section class="page" id="page-lessons" data-tab="lessons"><div class="page-inner"></div></section>
    <section class="page" id="page-review" data-tab="review"><div class="page-inner"></div></section>
    <section class="page" id="page-me"     data-tab="me"><div class="page-inner"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="3" width="16" height="18" rx="3.2"/><path d="M8 8h8M8 12h8M8 16h5"/>
      </svg>
      <span>今天</span>
    </button>
    <button class="tab" data-tab="lessons">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3.4l2.6 5.3 5.9.9-4.3 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.5 9.6l5.9-.9z"/>
      </svg>
      <span>经验库</span>
    </button>
    <button class="tab" data-tab="review">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3.5" y="12" width="4" height="8.2" rx="1.4"/>
        <rect x="10" y="7" width="4" height="13.2" rx="1.4"/>
        <rect x="16.5" y="3" width="4" height="17.2" rx="1.4"/>
      </svg>
      <span>回顾</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5c.6-4.1 3.8-6.6 7.5-6.6s6.9 2.5 7.5 6.6"/>
      </svg>
      <span>我的</span>
    </button>
  </nav>

</div>

<div id="overlay-root"></div>

<!-- 直接双击 index.html 时，浏览器会因安全策略拦掉模块脚本。
     这里用一个普通脚本兜底，给出提示，避免看到一片白屏。 -->
<script>
(function () {
  if (location.protocol !== 'file:') return;
  function warn() {
    if (window.__selflogModuleLoaded) return;
    var box = document.createElement('div');
    box.className = 'file-warn';
    var h = document.createElement('h2');
    h.textContent = '这个页面不能直接双击打开';
    var p1 = document.createElement('p');
    p1.textContent = '浏览器出于安全策略（CORS）会拦掉 file:// 下的脚本，所以双击 index.html 只会看到白屏。这不是页面写错了。';
    var p2 = document.createElement('p');
    p2.className = 'file-warn-fix';
    p2.textContent = '解决办法：回到这个文件夹，双击「双击预览.bat」——它会自动开一个小服务器并打开浏览器。';
    var p3 = document.createElement('p');
    p3.className = 'file-warn-sub';
    p3.textContent = '装到手机上以后是用 GitHub Pages 的网址打开，不存在这个问题。';
    box.appendChild(h); box.appendChild(p1); box.appendChild(p2); box.appendChild(p3);
    document.body.appendChild(box);
  }
  if (document.readyState === 'complete') setTimeout(warn, 400);
  else window.addEventListener('load', function () { setTimeout(warn, 400); });
})();
</script>

<script type="module" src="./js/app.js"></script>
</body>
</html>
